name: Reconcile official GitHub Releases
on:
  workflow_dispatch:
    inputs:
      package:
        description: Optional enrolled package name
        default: ''
      release_id:
        description: Optional existing GitHub Release ID
        default: ''
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
jobs:
  publish:
    uses: kujolang/kennel/.github/workflows/publish-kennel-package.yml@4fbe6481f6740abc9b239d617d0f366921978b3b
    with:
      package: ${{ inputs.package || '' }}
      release_id: ${{ inputs.release_id || '' }}
